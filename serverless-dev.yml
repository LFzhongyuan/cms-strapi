service: strapi-on-ecs

custom:
  securityGroupIds: sg-0d7ca8acdc6128663
  subnetIds1: subnet-03912d6c08b4805c0
  subnetIds2: subnet-01f2779b7cd5643bf
  subnetIds3: subnet-05637d433a138dbaa

provider:
  name: aws
  runtime: nodejs18.x
  region: ap-southeast-1
  iamRoleStatements:
    - Effect: Allow
      Action:
        - ecs:*
        - ec2:DescribeSubnets
        - ec2:DescribeSecurityGroups
      Resource: '*'

resources:
  Resources:
    StrapiECSCluster:
      Type: AWS::ECS::Cluster
      Properties:
        ClusterName: strapi-ecs-cluster

    StrapiTaskDefinition:
      Type: AWS::ECS::TaskDefinition
      Properties:
        Family: strapi-task-definition
        NetworkMode: awsvpc
        RequiresCompatibilities:
          - FARGATE
        Cpu: '256'
        Memory: '512'
        ExecutionRoleArn: !GetAtt ExecutionRole.Arn
        TaskRoleArn: !GetAtt TaskRole.Arn
        RuntimePlatform:
          OperatingSystemFamily: LINUX
          CpuArchitecture: X86_64
        ContainerDefinitions:
          - Name: strapi-container
            Image: 767397774598.dkr.ecr.ap-southeast-1.amazonaws.com/cms-strapi-dev:latest
            PortMappings:
              - ContainerPort: 1337
            Environment:
              - Name: NODE_ENV
                Value: dev

    ExecutionRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Statement:
            - Effect: Allow
              Principal:
                Service: ecs-tasks.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

    TaskRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Statement:
            - Effect: Allow
              Principal:
                Service: ecs-tasks.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: StrapiTaskPolicy
            PolicyDocument:
              Statement:
                - Effect: Allow
                  Action:
                    - logs:CreateLogGroup
                    - logs:CreateLogStream
                    - logs:PutLogEvents
                  Resource: '*'

    StrapiECSService:
      Type: AWS::ECS::Service
      Properties:
        Cluster: !Ref StrapiECSCluster
        TaskDefinition: !Ref StrapiTaskDefinition
        DesiredCount: 1
        LaunchType: FARGATE
        NetworkConfiguration:
          AwsvpcConfiguration:
            Subnets:
              - ${self:custom.subnetIds1}
              - ${self:custom.subnetIds2}
              - ${self:custom.subnetIds3}
            SecurityGroups:
              - ${self:custom.securityGroupIds}
